<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB API Demo</title>
    <link href="style.css" rel="stylesheet" />
    <script src="indexedDB_API.js" defer></script>
</head>
    
<body>
    <main class="app-container">
        <header>
            <h1>Task Storage</h1>
            <p class="subtitle">Powered by Native IndexedDB API</p>
        </header>
    
        <form id="task-form" class="card">
            <div class="form-group">
                <label for="task-title">Task Title</label>
                <input type="text" id="task-title" placeholder="e.g., Cache API payloads" required />
            </div>
    
            <div class="form-group">
                <label for="task-category">Category</label>
                <select id="task-category">
                    <option value="Development">Development</option>
                    <option value="Architecture">Architecture</option>
                    <option value="DevOps">DevOps</option>
                </select>
            </div>
    
            <button type="submit" class="btn primary-btn">Add Task</button>
        </form>
    
        <section class="task-section">
            <div class="section-header">
                <h2>Stored Records</h2>
                <button id="clear-all-btn" class="btn danger-btn-outline">Clear DB</button>
            </div>
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
            <p id="empty-state" class="empty-state">No records found in IndexedDB.</p>
        </section>
    </main>
</body>

</html>
